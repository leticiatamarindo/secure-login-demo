<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Página interna demonstrativa do Secure Login Demo.">
  <title>Painel | Secure Login Demo</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e0e0e0;
      background: #121212;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      visibility: hidden;
    }

    main {
      width: min(100%, 760px);
      margin: 8vh auto;
      padding: 36px;
      border: 1px solid #333333;
      border-radius: 16px;
      background: #1e1e1e;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
    }

    h1 { margin-top: 0; color: #ffffff; }
    p { color: #a0aabf; line-height: 1.6; }

    button {
      padding: 11px 16px;
      border: 0;
      border-radius: 8px;
      background: #d32f2f;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover { background: #b71c1c; }
    
    .notice { 
      margin-top: 24px; 
      font-size: 0.9rem; 
      color: #8893a8;
    }
  </style>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Painel interno</h1>
    <p>Você está na área de demonstração. Nenhuma informação de conta ou dado real é exibido nesta página.</p>
    <button id="logout-button" type="button">Sair</button>
    <p class="notice">A proteção desta página é apenas uma verificação no navegador. Um sistema real precisa validar a sessão no servidor em cada recurso protegido.</p>
  </main>
</body>
</html>
