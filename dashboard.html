<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Página interna demonstrativa do Secure Login Demo.">
  <title>Painel | Secure Login Demo</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f6fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      visibility: hidden;
    }

    main {
      width: min(100%, 760px);
      margin: 8vh auto;
      padding: 36px;
      border: 1px solid #e1e7f0;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 16px 48px rgb(22 38 68 / 9%);
    }

    h1 { margin-top: 0; }
    p { color: #526078; line-height: 1.6; }

    button {
      padding: 11px 16px;
      border: 0;
      border-radius: 8px;
      background: #a32121;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #821919; }
    .notice { margin-top: 24px; font-size: 0.9rem; }
  </style>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Painel interno</h1>
    <p>Você está na área de demonstração. Nenhuma informação de conta ou dado real é exibido nesta página.</p>
    <button id="logout-button" type="button">Sair</button>
    <p class="notice">A proteção desta página é apenas uma verificação no navegador. Um sistema real precisa validar a sessão no servidor em cada recurso protegido.</p>
  </main>
</body>
</html>
