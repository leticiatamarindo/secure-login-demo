<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Protótipo demonstrativo de login seguro apenas no front-end.">
  <link rel="stylesheet" href="css/style.css">
  <title>Entrar | Secure Login Demo</title>
  
  <script src="app.js" defer></script>
</head>
<body class="index-page">
  <main>
    <h1>Entrar</h1>
    <p class="intro">Acesse o protótipo Secure Login Demo.</p>

    <form id="login-form" novalidate>
      <label for="username">
        Usuário
        <input id="username" name="username" type="text" autocomplete="username" required maxlength="80">
      </label>

      <label for="password">
        Senha
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>

      <p class="hint">A senha de demonstração deve ter pelo menos 12 caracteres, incluindo maiúscula, minúscula, número e símbolo.</p>
      <button type="submit">Entrar</button>
      <p id="login-message" role="status" aria-live="polite"></p>
    </form>

    <aside class="notice">
      Protótipo somente de front-end: qualquer usuário não vazio com uma senha que atenda aos critérios é aceito. Não use credenciais reais.
    </aside>
  </main>
</body>
</html>
